<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>英単語マスター Unit 4</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background-color: #f4f6f9;
      color: #333;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* ヘッダー */
    header {
      background-color: #2c3e50;
      color: white;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    header h1 {
      font-size: 1.1rem;
      font-weight: bold;
    }

    /* ナビゲーションメニュー */
    nav {
      background-color: #34495e;
      display: flex;
      justify-content: space-around;
      padding: 8px 0;
    }

    nav button {
      background: none;
      border: none;
      color: #ecf0f1;
      font-size: 0.9rem;
      font-weight: bold;
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
    }

    nav button.active {
      background-color: #1abc9c;
      color: white;
    }

    /* メインエリア */
    main {
      flex: 1;
      padding: 16px;
      max-width: 600px;
      margin: 0 auto;
      width: 100%;
    }

    .page {
      display: none;
    }

    .page.active {
      display: block;
    }

    /* カード（勉強・復習） */
    .card-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .flashcard {
      background: white;
      border-radius: 10px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      text-align: center;
      cursor: pointer;
      user-select: none;
      transition: transform 0.1s ease, box-shadow 0.1s ease;
      border: 1px solid #e1e8ed;
    }

    .flashcard:active {
      transform: scale(0.98);
    }

    .flashcard .word {
      font-size: 1.25rem;
      font-weight: bold;
      color: #2c3e50;
    }

    .flashcard .meaning {
      display: none;
      margin-top: 8px;
      font-size: 1rem;
      color: #27ae60;
      font-weight: bold;
    }

    .flashcard.flipped .meaning {
      display: block;
    }

    /* パネル */
    .panel {
      background: white;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      margin-bottom: 16px;
    }

    .panel h2 {
      font-size: 1.2rem;
      margin-bottom: 16px;
      color: #2c3e50;
      text-align: center;
    }

    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
      transition: background-color 0.2s;
    }

    .btn-primary { background-color: #3498db; color: white; }
    .btn-success { background-color: #2ecc71; color: white; }
    .btn-warning { background-color: #e67e22; color: white; }

    .option-group {
      margin-bottom: 16px;
    }

    .option-group label.title {
      display: block;
      margin-bottom: 6px;
      font-weight: bold;
      font-size: 0.95rem;
    }

    .radio-group, .checkbox-group {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .radio-group label, .checkbox-group label {
      font-weight: normal;
      cursor: pointer;
      font-size: 0.95rem;
    }

    /* テスト画面 */
    .test-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      font-weight: bold;
      color: #7f8c8d;
    }

    .question-card {
      background: white;
      border-radius: 12px;
      padding: 24px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      border: 3px solid #bdc3c7;
      margin-bottom: 16px;
      transition: border-color 0.3s;
    }

    .question-card.correct { border-color: #2ecc71; }
    .question-card.wrong { border-color: #e74c3c; }

    .question-main {
      font-size: 1.3rem;
      font-weight: bold;
      color: #2c3e50;
      margin-bottom: 10px;
      line-height: 1.4;
    }

    .question-sub {
      font-size: 0.95rem;
      color: #7f8c8d;
      min-height: 20px;
    }

    /* 4択ボタンエリア */
    .choice-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 16px;
    }

    @media (max-width: 480px) {
      .choice-grid {
        grid-template-columns: 1fr;
      }
    }

    .choice-btn {
      background: white;
      border: 2px solid #3498db;
      color: #2c3e50;
      padding: 14px 10px;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
      text-align: center;
      word-break: break-word;
    }

    .choice-btn:active {
      transform: scale(0.98);
    }

    .choice-btn.correct-choice {
      background-color: #2ecc71 !important;
      border-color: #2ecc71 !important;
      color: white !important;
    }

    .choice-btn.wrong-choice {
      background-color: #e74c3c !important;
      border-color: #e74c3c !important;
      color: white !important;
    }

    /* テキスト入力エリア */
    .input-area {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    .input-area input {
      flex: 1;
      padding: 12px;
      font-size: 1.1rem;
      border: 2px solid #ddd;
      border-radius: 8px;
      text-align: center;
      outline: none;
    }

    .input-area input:focus {
      border-color: #3498db;
    }

    .result-msg {
      text-align: center;
      font-size: 1.1rem;
      font-weight: bold;
      min-height: 28px;
      margin-bottom: 12px;
    }

    .result-msg.correct { color: #2ecc71; }
    .result-msg.wrong { color: #e74c3c; }

    .empty-msg {
      text-align: center;
      color: #95a5a6;
      padding: 40px 0;
      font-size: 1rem;
    }
  </style>
</head>
<body>

  <header>
    <h1>英単語マスター Unit 4</h1>
  </header>

  <nav>
    <button id="nav-study" class="active" onclick="showPage('study')">📖 勉強用</button>
    <button id="nav-test" onclick="showPage('test-select')">📝 テスト</button>
    <button id="nav-review" onclick="showPage('review')">❌ 復習</button>
  </nav>

  <main>
    <!-- 1. 勉強用ページ -->
    <div id="page-study" class="page active">
      <div style="text-align:center; margin-bottom: 12px; font-size:0.9rem; color:#666;">
        タップして日本語訳を表示 / 非表示
      </div>
      <div id="study-list" class="card-list"></div>
    </div>

    <!-- 2. テスト選択画面 -->
    <div id="page-test-select" class="page">
      <div class="panel">
        <h2>テスト形式の選択</h2>
        <button class="btn btn-primary" onclick="setupTest('qa')">1. 一問一答テスト</button>
        <button class="btn btn-success" onclick="setupTest('fill')">2. 英文穴埋めテスト</button>
      </div>
    </div>

    <!-- 2-2. テスト設定画面 -->
    <div id="page-test-setup" class="page">
      <div class="panel">
        <h2 id="setup-title">テスト設定</h2>

        <div class="option-group">
          <label class="title">回答方式:</label>
          <div class="radio-group">
            <label><input type="radio" name="ans-style" value="choice" checked> 選択式（4択）</label>
            <label><input type="radio" name="ans-style" value="input"> 直接入力（タイピング）</label>
          </div>
        </div>

        <div class="option-group">
          <label class="title">問題数:</label>
          <div class="radio-group">
            <label><input type="radio" name="q-count" value="10" checked> 10問</label>
            <label><input type="radio" name="q-count" value="15"> 15問</label>
            <label><input type="radio" name="q-count" value="20"> 20問</label>
          </div>
        </div>

        <div class="option-group" id="trans-option-group">
          <label class="title">日本語訳の表示:</label>
          <div class="checkbox-group">
            <label><input type="checkbox" id="show-trans-check" checked> 問題に日本語訳を表示する</label>
          </div>
        </div>

        <button class="btn btn-warning" onclick="startTest()">テスト開始</button>
        <button class="btn" style="background:#8e44ad; color:white;" onclick="showPage('test-select')">戻る</button>
      </div>
    </div>

    <!-- 2-3. テスト実行画面 -->
    <div id="page-test-runner" class="page">
      <div class="test-header">
        <span id="test-progress">問題 1 / 10</span>
        <button onclick="quitTest()" style="background:none; border:none; color:#e74c3c; font-weight:bold; cursor:pointer;">中断</button>
      </div>

      <div id="question-card" class="question-card">
        <div id="question-main" class="question-main">---</div>
        <div id="question-sub" class="question-sub">---</div>
      </div>

      <!-- 4択エリア -->
      <div id="choice-area" class="choice-grid"></div>

      <!-- 入力エリア -->
      <div id="input-area" class="input-area" style="display:none;">
        <input type="text" id="answer-input" placeholder="回答を入力" autocomplete="off">
        <button id="submit-btn" class="btn btn-primary" style="width: auto; margin:0;" onclick="checkTextAnswer()">回答</button>
      </div>

      <div id="result-msg" class="result-msg"></div>

      <button id="next-btn" class="btn btn-success" style="display:none;" onclick="nextQuestion()">次へ ➔</button>
    </div>

    <!-- 3. 復習（間違えた単語）ページ -->
    <div id="page-review" class="page">
      <div style="text-align:center; margin-bottom: 12px; font-size:0.9rem; color:#e74c3c; font-weight:bold;">
        間違えた単語の復習カード
      </div>
      <div id="review-list" class="card-list"></div>
    </div>
  </main>

      ]},
      { id: 36, word: "tool", meaning: "道具、手段、ツール", sentences: [
        { en: "A hammer is a useful _______ for building.", ja: "金づちは建設に役立つ道具です。" },

        { en: "How do you _______ this word into Japanese?", ja: "この単語を日本語にどうやって翻訳しますか？" },
        { en: "I need a dictionary to _______ the document.", ja: "書類を翻訳するために辞書が必要です。" }
      ]},
      { id: 38, word: "too ~ to ...", meaning: "...するには〜すぎる", sentences: [
        { en: "I am _______ tired to walk any further.", ja: "私は疲れすぎていてこれ以上歩けません。" },
        { en: "The soup is _______ hot to eat.", ja: "そのスープは熱すぎて食べられません。" },
        { en: "She was _______ busy to watch TV.", ja: "彼女は忙しすぎてテレビを見ることができませんでした。" },
        { en: "The box is _______ heavy to lift.", ja: "その箱は重すぎて持ち上げられません。" },
        { en: "It is _______ dark to see anything.", ja: "暗すぎて何も見えません。" }
      ]}
    ];

    // アプリ状態
    let wrongWordIds = new Set();
    let currentTestType = 'qa'; // 'qa' or 'fill'
    let currentAnsStyle = 'choice'; // 'choice' or 'input'
    let currentQuestions = [];
    let currentQuestionIndex = 0;
    let currentCorrectAnswer = '';
    let currentQaMode = 'en_to_ja';

    window.onload = () => {
      renderStudyCards();
      renderReviewCards();

      document.getElementById('answer-input').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') checkTextAnswer();
      });
    };

    function showPage(pageId) {
      document.querySelectorAll('.page').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('nav button').forEach(el => el.classList.remove('active'));

      document.getElementById(`page-${pageId}`).classList.add('active');
      const navBtn = document.getElementById(`nav-${pageId.split('-')[0]}`);
      if (navBtn) navBtn.classList.add('active');

      if (pageId === 'review') renderReviewCards();
    }

    function renderStudyCards() {
      const container = document.getElementById('study-list');
      container.innerHTML = VOCAB_DATA.map(item => createCardHtml(item)).join('');
    }

    function renderReviewCards() {
      const container = document.getElementById('review-list');
      const wrongList = VOCAB_DATA.filter(item => wrongWordIds.has(item.id));

      if (wrongList.length === 0) {
        container.innerHTML = '<div class="empty-msg">間違えた単語はありません！✨</div>';
      } else {
        container.innerHTML = wrongList.map(item => createCardHtml(item)).join('');
      }
    }

    function createCardHtml(item) {
      return `
        <div class="flashcard" onclick="this.classList.toggle('flipped')">
          <div class="word">${item.word}</div>
          <div class="meaning">【訳】${item.meaning}</div>
        </div>
      `;
    }

    function setupTest(type) {
      currentTestType = type;
      document.getElementById('setup-title').innerText = type === 'qa' ? '一問一答テスト設定' : '英文穴埋めテスト設定';
      document.getElementById('trans-option-group').style.display = type === 'fill' ? 'block' : 'none';
      showPage('test-setup');
    }

    function startTest() {
      const countInput = document.querySelector('input[name="q-count"]:checked');
      const count = parseInt(countInput.value, 10);
      
      const styleInput = document.querySelector('input[name="ans-style"]:checked');
      currentAnsStyle = styleInput.value;

      const shuffled = [...VOCAB_DATA].sort(() => 0.5 - Math.random());
      currentQuestions = shuffled.slice(0, Math.min(count, shuffled.length));

      currentQuestionIndex = 0;
      showPage('test-runner');
      loadQuestion();
    }

    function loadQuestion() {
      const item = currentQuestions[currentQuestionIndex];
      const total = currentQuestions.length;

      document.getElementById('test-progress').innerText = `問題 ${currentQuestionIndex + 1} / ${total}`;
      
      const card = document.getElementById('question-card');
      card.className = 'question-card';

      document.getElementById('result-msg').innerText = '';
      document.getElementById('result-msg').className = 'result-msg';
      document.getElementById('next-btn').style.display = 'none';

      // 回答欄切り替え
      const choiceArea = document.getElementById('choice-area');
      const inputArea = document.getElementById('input-area');

      if (currentAnsStyle === 'choice') {
        choiceArea.style.display = 'grid';
        inputArea.style.display = 'none';
      } else {
        choiceArea.style.display = 'none';
        inputArea.style.display = 'flex';
        const input = document.getElementById('answer-input');
        input.value = '';
        input.disabled = false;
        input.focus();
        document.getElementById('submit-btn').disabled = false;
      }

      // 問題生成
      let optionsKey = 'word';
      if (currentTestType === 'qa') {
        currentQaMode = Math.random() < 0.5 ? 'en_to_ja' : 'ja_to_en';
        if (currentQaMode === 'en_to_ja') {
          document.getElementById('question-main').innerText = item.word;
          document.getElementById('question-sub').innerText = '日本語の意味を選んでください';
          currentCorrectAnswer = item.meaning;
          optionsKey = 'meaning';
        } else {
          document.getElementById('question-main').innerText = item.meaning;
          document.getElementById('question-sub').innerText = '英単語を選んでください';
          currentCorrectAnswer = item.word;
          optionsKey = 'word';
        }
      } else {
        const sent = item.sentences[Math.floor(Math.random() * item.sentences.length)];
        const showTrans = document.getElementById('show-trans-check').checked;

        document.getElementById('question-main').innerText = sent.en;
        document.getElementById('question-sub').innerText = showTrans ? sent.ja : '';
        currentCorrectAnswer = item.word;
        optionsKey = 'word';
      }

      // 4択ボタン作成
      if (currentAnsStyle === 'choice') {
        createChoices(item, optionsKey);
      }
    }

    // 4択作成
    function createChoices(currentItem, optionsKey) {
      const choiceArea = document.getElementById('choice-area');
      choiceArea.innerHTML = '';

      // 正解以外のダミーを3つ選ぶ
      const dummyCandidates = VOCAB_DATA.filter(v => v.id !== currentItem.id);
      const shuffledDummies = dummyCandidates.sort(() => 0.5 - Math.random()).slice(0, 3);
      
      const options = [currentItem[optionsKey], ...shuffledDummies.map(d => d[optionsKey])];
      const shuffledOptions = options.sort(() => 0.5 - Math.random());

      shuffledOptions.forEach(optText => {
        const btn = document.createElement('button');
        btn.className = 'choice-btn';
        btn.innerText = optText;
        btn.onclick = () => checkChoiceAnswer(optText, btn);
        choiceArea.appendChild(btn);
      });
    }

    // 選択式の回答判定
    function checkChoiceAnswer(selectedVal, clickedBtn) {
      const item = currentQuestions[currentQuestionIndex];
      const buttons = document.querySelectorAll('.choice-btn');
      buttons.forEach(b => b.disabled = true); // 連打防止

      const card = document.getElementById('question-card');
      const msg = document.getElementById('result-msg');

      if (selectedVal === currentCorrectAnswer) {
        card.classList.add('correct');
        clickedBtn.classList.add('correct-choice');
        msg.innerText = '⭕ 正解！';
        msg.classList.add('correct');
      } else {
        card.classList.add('wrong');
        clickedBtn.classList.add('wrong-choice');
        
        // 正解ボタンを緑色で強調表示
        buttons.forEach(b => {
          if (b.innerText === currentCorrectAnswer) {
            b.classList.add('correct-choice');
          }
        });

        msg.innerText = `❌ 不正解... 正解: ${currentCorrectAnswer}`;
        msg.classList.add('wrong');
        wrongWordIds.add(item.id);
      }

      document.getElementById('next-btn').style.display = 'block';
    }

    // 入力式の回答判定
    function checkTextAnswer() {
      const input = document.getElementById('answer-input');
      const userAns = input.value.trim();
      if (!userAns) return;

      const item = currentQuestions[currentQuestionIndex];
      let isCorrect = false;

      if (currentTestType === 'qa' && currentQaMode === 'en_to_ja') {
        if (item.meaning.includes(userAns)) isCorrect = true;
      } else {
        if (userAns.toLowerCase() === currentCorrectAnswer.toLowerCase()) isCorrect = true;
      }

      input.disabled = true;
      document.getElementById('submit-btn').disabled = true;

      const card = document.getElementById('question-card');
      const msg = document.getElementById('result-msg');

      if (isCorrect) {
        card.classList.add('correct');
        msg.innerText = '⭕ 正解！';
        msg.classList.add('correct');
      } else {
        card.classList.add('wrong');
        msg.innerText = `❌ 不正解... 正解: ${currentCorrectAnswer}`;
        msg.classList.add('wrong');
        wrongWordIds.add(item.id);
      }

      document.getElementById('next-btn').style.display = 'block';
    }

    function nextQuestion() {
      currentQuestionIndex++;
      if (currentQuestionIndex < currentQuestions.length) {
        loadQuestion();
      } else {
        alert('テスト終了です！お疲れ様でした。');
        showPage('study');
      }
    }

    function quitTest() {
      if (confirm('テストを終了しますか？')) {
        showPage('study');
      }
    }
  </script>
